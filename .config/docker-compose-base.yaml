services:
  grafana:
    user: root
    container_name: 'dvelop-odata-datasource'

    build:
      context: .
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.3.2}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - ${GRAFANA_PORT:-3000}:3000/tcp
      - 2345:2345/tcp # delve
    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE
    volumes:
      - grafana-data:/var/lib/grafana
      - ../dist:/var/lib/grafana/plugins/fledge-odata-datasource
      - ../provisioning:/etc/grafana/provisioning
      - ..:/root/dvelop-odata-datasource

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.fledge-odata-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_INSTALL_PLUGINS: yesoreyeram-infinity-datasource
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: fledge-odata-datasource
      HELPCRUNCH_API_TOKEN: ${HELPCRUNCH_API_TOKEN:-}
      GITEA_API_TOKEN: ${GITEA_API_TOKEN:-}

volumes:
  grafana-data:
